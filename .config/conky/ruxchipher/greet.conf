-- ruxchipher GREET: welcome card after login/unlock (card only, ~3 s, then conky exits),
-- or the full-screen goodbye before the session ends (GREET_FULL=1, stays black until shutdown).
-- 'override' keeps it above every window without taking focus. Drawn by greet.lua.

local full = os.getenv('GREET_FULL') == '1'
local sw, sh = tonumber(os.getenv('GREET_W') or '') or 1920, tonumber(os.getenv('GREET_H') or '') or 1080

conky.config = {
    output_backend = 'x11',

    own_window = true,
    own_window_type = 'override',
    own_window_class = 'Conky',
    own_window_title = 'ruxchipher-greet',
    own_window_color = '#00000000',
    double_buffer = true,

    alignment = full and 'top_left' or 'middle_middle',
    gap_x = 0,
    gap_y = full and 0 or 60,
    border_inner_margin = 0,
    border_outer_margin = 0,
    border_width = 0,
    minimum_width = full and sw or 640,
    maximum_width = full and sw or 640,
    minimum_height = full and sh or 220,

    update_interval = full and 0.033 or 0.05,   -- 30 fps for the goodbye, 20 fps for the welcome
    total_run_times = full and 0 or 61,         -- goodbye runs until the session ends

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=1',

    lua_load = '/home/ruxchipher/.config/conky/ruxchipher/greet.lua',
    lua_draw_hook_pre = 'greet',
}

conky.text = [[ ]]
