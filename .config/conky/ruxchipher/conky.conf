-- ruxchipher HUD: Tokyo Night system monitor for the GNOME desktop.
-- Everything visible is drawn by hud.lua; this file only sets up the window.

conky.config = {
    -- GNOME has no layer-shell, so draw through XWayland as a desktop window
    output_backend = 'x11',

    own_window = true,
    own_window_type = 'desktop',
    own_window_class = 'Conky',
    own_window_title = 'ruxchipher-hud',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_color = '#00000000',
    double_buffer = true,

    alignment = 'top_right',
    gap_x = 28,
    gap_y = 56,
    minimum_width = 360,
    maximum_width = 360,
    minimum_height = 800,

    update_interval = 1,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=1',

    lua_load = '/home/ruxchipher/.config/conky/ruxchipher/hud.lua',
    lua_draw_hook_pre = 'main',
}

conky.text = [[ ]]
