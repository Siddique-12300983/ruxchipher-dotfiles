# ruxchipher sentinel allowlist: listening ports that are expected and shouldn't alert.
#
#   <process>  <address>     shell-style wildcards (* ?) in both
#
# Processes sentinel can't see (owned by root) are matched as "root".
# Allowed listeners are still recorded, quietly, in ~/.local/state/ruxchipher-sentinel/allowed.log.
# Failed-password alerts can't be allowlisted. Changes apply on the next poll (15 s).

spotify   *                # Spotify Connect: lets your phone control playback here
root      127.0.0.1:59??   # VM screen consoles (VNC/SPICE) from libvirt, this laptop only
root      [::1]:59??
